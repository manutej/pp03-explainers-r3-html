<!DOCTYPE html><html><head><meta charset=utf-8><title>v04-chain-of-thought.html</title>
<script>
(async()=>{
const parts=await Promise.all([0,1,2].map(i=>fetch('/payloads/v04-chain-of-thought.b64.p'+i).then(r=>r.text())));
const b64=parts.join('').replace(/\s+/g,'');
const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
document.open();document.write(html);document.close();
})().catch(e=>{document.body.textContent='Inflate failed: '+e;});
</script></head><body>Loading…</body></html>
