<!DOCTYPE html><html><head><meta charset=utf-8><title>v07-reflexion.html</title>
<script>
(async()=>{
const b64=await (await fetch('/payloads/v07-reflexion.b64')).text();
const bin=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));
const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
document.open();document.write(html);document.close();
})().catch(e=>{document.body.textContent='Inflate failed: '+e;});
</script></head><body>Loading…</body></html>
